name: deploy-site

# main push(=APK/메타데이터 갱신) 또는 수동 실행 시
# public/ (다운로드 페이지 + OTA version.json + F-Droid 저장소) 을 만들어
# GitHub Pages 로 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 설치 (F-Droid index 서명용)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: F-Droid 키스토어 복원
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${FDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p fdroid
            printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 -d > fdroid/keystore.jks
            echo "keystore restored ($(wc -c < fdroid/keystore.jks) bytes)"
          else
            echo "::warning::FDROID_KEYSTORE_BASE64 시크릿이 없습니다. index-v1.jar 서명이 실패할 수 있습니다."
          fi

      - name: 사이트 + F-Droid 저장소 + OTA JSON 생성
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: python3 scripts/site/build-site.py

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
