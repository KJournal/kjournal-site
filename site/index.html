<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KJournal __MAIN_VERSION__ — 다운로드</title>
<meta name="description" content="KJournal 한국어 배포판 다운로드 (Android)">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#07080c">
<style>
  :root {
    --bg:#07080c; --fg:#eceef4; --muted:#8f96a8; --muted-2:#6b7280;
    --accent:#7c8cff; --accent-2:#39e6d0; --line:rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; min-height: 100%; display: grid; place-items: center; padding: 2rem 1.25rem; overflow: hidden; }
  .stage::before {
    content: ""; position: absolute; inset: -30% -10% auto; height: 90vh; pointer-events: none;
    background:
      radial-gradient(42% 42% at 50% 34%, rgba(124,140,255,.28), transparent 70%),
      radial-gradient(34% 34% at 72% 18%, rgba(57,230,208,.16), transparent 70%);
    filter: blur(12px);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .30;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(60% 55% at 50% 40%, #000 30%, transparent 100%);
  }
  .inner { position: relative; z-index: 1; text-align: center; width: 100%; max-width: 640px; }
  .appicon {
    width: 104px; height: 104px; border-radius: 26px; display: block; margin: 0 auto 1.4rem;
    box-shadow: 0 22px 60px rgba(0,0,0,.6);
  }
  .typing { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .cta { display: flex; flex-direction: column; align-items: center; gap: .7rem; margin-top: 2rem; }
  a.btn {
    display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; min-width: 240px;
    justify-content: center; padding: .95rem 1.6rem; border-radius: 14px; font-weight: 800;
    color: #fff; border: 1px solid transparent;
    background: linear-gradient(135deg, var(--accent), #5f6ef0 60%, #4a58dd);
    box-shadow: 0 14px 40px rgba(95,110,240,.35);
    transition: transform .12s ease, filter .12s ease;
  }
  a.btn:hover { transform: translateY(-1px); filter: brightness(1.07); }
  a.btn .txt { text-align: left; line-height: 1.25; }
  a.btn small { display: block; font-weight: 600; font-size: .72rem; opacity: .85; }
  a.btn.ghost { background: rgba(255,255,255,.04); color: var(--fg); border-color: var(--line); box-shadow: none; }
  a.btn.ghost:hover { border-color: var(--accent); }
  .meta { color: var(--muted-2); font-size: .8rem; margin-top: 1.3rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; }
  .hash { word-break: break-all; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="inner">
    <img class="appicon" src="icon.png" alt="KJournal">
    <img class="typing" alt="KJournal"
         src="https://readme-typing-svg.demolab.com?font=JetBrains+Mono&amp;weight=700&amp;size=32&amp;duration=2800&amp;pause=900&amp;color=7C3AED&amp;center=true&amp;vCenter=true&amp;width=520&amp;lines=KJournal;Your+timeline%2C+your+record.;Built+for+personal+clarity.">

    <div class="cta">
      <a class="btn" href="__MAIN_APK__">
        <span class="txt">다운로드<small>__MAIN_VERSION__ · __MAIN_SIZE__ MB · __MAIN_DATE__</small></span>
      </a>
      <a class="btn ghost __BETA_HIDDEN__" href="__BETA_APK__">
        <span class="txt">배타 다운로드<small>__BETA_VERSION__ · __BETA_SIZE__ MB · __BETA_DATE__</small></span>
      </a>
    </div>

    <p class="meta">Android 9 (API 28) 이상 · <code>__APP_ID__</code><br><span class="hash">SHA-256 __MAIN_SHA256__</span></p>
  </div>
</div>

</body>
</html>
